spring:
  application:
    name: ms-ofisy-execution
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/ms_ofisy_execution_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  docker:
    compose:
      file: compose.db.yaml
  config:
    import: optional:file:.env[.properties]
management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  level:
    org.flywaydb: DEBUG