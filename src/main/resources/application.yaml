spring:
  application:
    name: ms-ofisy-execution
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/ms_ofisy_execution_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  docker:
    compose:
      file: compose.db.yaml
  config:
    import: optional:file:.env[.properties]
  cloud:
    aws:
      region:
        static: us-east-1
      sqs:
        queue-not-found-strategy: fail
ofisy:
  messaging:
    queues:
      execution: ofisy-execution.fifo
    topics:
      execution: ofisy-execution-events.fifo
    outbox:
      publish-interval: 1s
      batch-size: 100
jwt:
  secret: ${JWT_SECRET}
security:
  public-paths:
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
    - /actuator/health/**
management:
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    tags:
      service: ${DD_SERVICE:ms-ofisy-execution}
      env: ${DD_ENV:local}
  datadog:
    metrics:
      export:
        enabled: ${DD_METRICS_ENABLED:false}
        api-key: ${DD_API_KEY:}
        uri: ${DD_METRICS_URI:https://api.us5.datadoghq.com}
        step: 30s
logging:
  level:
    org.flywaydb: DEBUG