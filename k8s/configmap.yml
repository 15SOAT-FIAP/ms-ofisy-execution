apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-ofisy-execution-config
data:
  POSTGRES_HOST: "<RDS_ADDRESS>"
  POSTGRES_DB: "ms_ofisy_execution_db"
  SPRING_PROFILES_ACTIVE: "k8s"
  JAVA_TOOL_OPTIONS: "-javaagent:/app/dd-java-agent.jar -XX:MaxRAMPercentage=75"
  DD_SERVICE: "ms-ofisy-execution"
  DD_ENV: "production"
  DD_VERSION: "<IMAGE_TAG>"
  DD_METRICS_ENABLED: "true"
  DD_LOGS_INJECTION: "true"
  DD_TRACE_AGENT_PORT: "8126"
  DD_TRACE_OTEL_ENABLED: "true"
