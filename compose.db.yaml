services:
  localstack:
    image: localstack/localstack:4.13.1
    container_name: ms-ofisy-execution-local-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sns,sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "./localstack/init/ready.d:/etc/localstack/init/ready.d"
    healthcheck:
      test: [ "CMD-SHELL", "curl -s localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'" ]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    container_name: ms-ofisy-execution-local-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
